name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack
        run: dotnet pack GremlinT.Core/GremlinT.Core.csproj --configuration Release --no-build --output ./nupkg

      - name: Push to NuGet
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain OIDC token from GitHub."
            exit 1
          fi
          dotnet nuget push ./nupkg/*.nupkg --api-key "$OIDC_TOKEN" --source https://api.nuget.org/v3/index.json --skip-duplicate
